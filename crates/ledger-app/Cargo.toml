[package]
name = "ledger-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Everything Home Ledger does, behind the desktop app, the hl command line and the phone app alike."

[dependencies]
ledger-domain.workspace = true
ledger-math.workspace = true
ledger-store.workspace = true
ledger-writer.workspace = true
ledger-config.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
time = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
