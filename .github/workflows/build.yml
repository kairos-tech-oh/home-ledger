name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback: the whole core is platform independent, so it is checked
  # once rather than on each runner.
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Needed to compile the Tauri crate. Worth the time: excluding it would
      # skip the tests that keep personal identity out of the stored document.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Tauri's Linux deps. Windows needs none: WebView2 ships with the OS and
      # the NSIS installer pulls the bootstrapper if it is ever missing.
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev build-essential curl wget file

      - run: npm ci
      - run: npm --prefix ui ci

      - name: Bundle installers (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build -- --bundles nsis,msi

      - name: Bundle installers (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: npm run build -- --bundles deb,rpm

      # AppImage shells out to linuxdeploy, which needs FUSE and network at
      # bundle time. It is the portable Linux artifact, so it is worth having,
      # but it must not fail the build that produced a working .deb.
      - name: Bundle AppImage (best effort)
        if: matrix.os == 'ubuntu-22.04'
        continue-on-error: true
        run: npm run build -- --bundles appimage

      - uses: actions/upload-artifact@v4
        with:
          name: home-ledger-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

  # A tagged push publishes the installers so a machine can just download one.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
